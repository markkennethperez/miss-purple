<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b0b3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Make a Wish</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
/* =========================================================
   THEME  (80% purple / 20% pink)
   Change the colors here and the whole site updates.
   ========================================================= */
:root {
  /* purple = main (80%) */
  --purple-900: #1b0b3a;
  --purple-800: #2a1258;
  --purple-700: #3d1b7a;
  --purple-500: #6d3ab3;
  --purple-300: #b794f6;
  --purple-100: #ece1ff;
  /* pink = accent (20%) */
  --pink-500: #ff5fb0;
  --pink-300: #ff9fd2;
  --pink-100: #ffd9ee;

  --card: rgba(255, 255, 255, 0.08);
  --card-border: rgba(255, 255, 255, 0.16);
  --radius: 22px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: "Poppins", system-ui, sans-serif;
  color: var(--purple-100);
  background: linear-gradient(180deg, var(--purple-900), var(--purple-800) 45%, var(--purple-900));
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

.script { font-family: "Dancing Script", cursive; font-weight: 700; }

/* twinkling stars background */
.stars {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 20px 30px, #fff8, transparent),
    radial-gradient(2px 2px at 90px 120px, var(--pink-300), transparent),
    radial-gradient(1.5px 1.5px at 160px 60px, #fff9, transparent),
    radial-gradient(2px 2px at 230px 170px, #fff7, transparent),
    radial-gradient(1.5px 1.5px at 300px 20px, #fff8, transparent);
  background-size: 320px 200px;
  animation: twinkle 4s ease-in-out infinite alternate;
}
@keyframes twinkle { from { opacity: .35; } to { opacity: .9; } }

#confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; }

main, header, footer { position: relative; z-index: 1; }

/* ---------- HERO ---------- */
.hero {
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 2rem 1.2rem;
  background: radial-gradient(circle at 50% 30%, rgba(109, 58, 179, .55), transparent 65%);
}
.hero-small { color: var(--pink-300); letter-spacing: .12em; text-transform: uppercase; font-size: .95rem; }
.hero h1 {
  font-size: clamp(4.5rem, 18vw, 9rem); line-height: 1.05;
  background: linear-gradient(90deg, var(--purple-100), var(--pink-300));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: float 4s ease-in-out infinite;
}
.hero-date { font-size: 1.2rem; color: var(--purple-300); margin-bottom: .6rem; }
.hero-tag { max-width: 520px; opacity: .85; margin-bottom: 1.8rem; font-weight: 300; }
@keyframes float { 50% { transform: translateY(-10px); } }

.menu { display: flex; flex-wrap: wrap; gap: .7rem; justify-content: center; }
.scroll-down { margin-top: 2rem; font-size: 2rem; color: var(--pink-300); text-decoration: none; animation: bounce 1.6s infinite; }
@keyframes bounce { 50% { transform: translateY(8px); } }

/* ---------- BUTTONS ---------- */
.btn {
  display: inline-block; cursor: pointer; border: none; text-decoration: none;
  padding: .75rem 1.5rem; border-radius: 999px; font: 600 .95rem "Poppins", sans-serif;
  color: #fff; background: var(--purple-500);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .3);
  transition: transform .2s, background .2s;
}
.btn:hover { transform: translateY(-3px); background: var(--pink-500); }
.btn.ghost { background: transparent; border: 2px solid var(--purple-300); box-shadow: none; }
.btn.ghost:hover { border-color: var(--pink-500); }
.btn.small { padding: .5rem 1.1rem; font-size: .85rem; }

/* ---------- MODULES (shared) ---------- */
.module { padding: 5rem 1.2rem; max-width: 1000px; margin: 0 auto; text-align: center; }
.module h2 { font-size: clamp(2.2rem, 7vw, 3.4rem); color: var(--pink-300); margin-bottom: .3rem; }
.sub { opacity: .75; margin-bottom: 2.2rem; font-weight: 300; }

.reveal { opacity: 0; transform: translateY(26px); transition: opacity .7s, transform .7s; }
.reveal.show { opacity: 1; transform: none; }

/* ---------- FAVORITES ---------- */
.fav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1.1rem; }
.fav-card {
  display: flex; flex-direction: column; align-items: center; gap: .15rem;
  padding: 1.6rem 1rem; border-radius: var(--radius);
  background: var(--card); border: 1px solid var(--card-border);
  backdrop-filter: blur(6px);
}
.fav-card:hover { border-color: var(--pink-500); transform: translateY(-4px) !important; }
.fav-emoji { font-size: 2.4rem; }
.fav-label { font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; color: var(--purple-300); }
.fav-value { font-size: 1.1rem; font-weight: 600; }

/* ---------- LETTER ---------- */
.envelope-wrap { display: flex; flex-direction: column; align-items: center; gap: 1rem; margin-top: 2rem; cursor: pointer; }
.envelope { position: relative; width: min(340px, 86vw); height: 220px; transition: margin-bottom .6s; }
.envelope::before { /* back of envelope */
  content: ""; position: absolute; inset: 0; background: var(--purple-500); border-radius: 10px;
}
.pocket {
  position: absolute; inset: 0; z-index: 3; border-radius: 10px;
  background:
    linear-gradient(to top right, transparent 49.5%, var(--purple-700) 50%) left / 50% 100% no-repeat,
    linear-gradient(to top left, transparent 49.5%, var(--purple-700) 50%) right / 50% 100% no-repeat;
  pointer-events: none;
}
.pocket::after { content: ""; position: absolute; inset: 0; border-radius: 10px; background: linear-gradient(to top, var(--purple-700) 0 45%, transparent 45%); clip-path: polygon(0 100%, 50% 35%, 100% 100%); }
.flap {
  position: absolute; top: 0; left: 0; width: 100%; height: 55%; z-index: 4;
  background: var(--purple-300); transform-origin: top; transition: transform .6s .2s, z-index 0s .4s;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}
.heart { position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%); z-index: 5; font-size: 1.8rem; transition: opacity .3s; }
.paper {
  position: absolute; left: 8%; width: 84%; top: 8%; height: 80%; z-index: 2;
  background: linear-gradient(180deg, #fff, var(--pink-100)); color: var(--purple-900);
  border-radius: 8px; overflow: hidden; transition: transform .8s .4s, height .8s .4s;
  box-shadow: 0 -4px 14px rgba(0, 0, 0, .15);
}
.paper-inner { padding: 1.3rem 1.4rem; text-align: left; font-size: .95rem; }
.paper-inner p { margin-bottom: .8rem; }
.signature { font-size: 1.6rem; line-height: 1.2; color: var(--purple-700); text-align: right; }

.envelope-wrap.open .flap { transform: rotateX(180deg); z-index: 1; }
.envelope-wrap.open .heart { opacity: 0; }
.envelope-wrap.open .paper { transform: translateY(-90px); height: auto; min-height: 330px; z-index: 6; }
.envelope-wrap.open .envelope { margin-bottom: 300px; }
.hint { color: var(--pink-300); font-weight: 600; }

/* ---------- CAKE ---------- */
.cake { position: relative; width: 260px; margin: 3.5rem auto 1.6rem; display: flex; flex-direction: column; align-items: center; }
.layer { width: 100%; border-radius: 14px; position: relative; }
.layer.top { width: 60%; height: 60px; background: var(--purple-300); }
.layer.mid { width: 80%; height: 70px; background: var(--purple-500); margin-top: -6px; }
.layer.bottom { width: 100%; height: 80px; background: var(--purple-700); margin-top: -6px; }
.layer::before { /* pink icing drip */
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 18px;
  background: var(--pink-500); border-radius: 14px 14px 40px 40px;
}
.plate { width: 130%; height: 14px; background: var(--pink-300); border-radius: 50%; margin-top: -2px; }

.candles { position: absolute; top: -50px; display: flex; gap: 14px; justify-content: center; width: 80%; z-index: 2; }
.candle { position: relative; width: 10px; height: 46px; border-radius: 3px; background: linear-gradient(var(--pink-100), var(--pink-500)); cursor: pointer; }
.flame {
  position: absolute; left: 50%; top: -24px; width: 14px; height: 24px; transform: translateX(-50%);
  background: radial-gradient(circle at 50% 70%, #fff6c9, #ffb347 60%, #ff5f6d);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  box-shadow: 0 0 16px 4px rgba(255, 180, 70, .6);
  animation: flicker .15s infinite alternate; transform-origin: bottom;
  transition: opacity .3s, transform .3s;
}
.candle.out .flame { opacity: 0; transform: translateX(-50%) scale(.2); animation: none; }
.candle.out::after { /* smoke */
  content: ""; position: absolute; left: 50%; top: -20px; width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255, 255, 255, .5); animation: smoke 1.4s ease-out forwards;
}
@keyframes flicker { to { transform: translateX(-50%) scale(1.08, .94) rotate(2deg); } }
@keyframes smoke { to { transform: translateY(-40px) scale(3); opacity: 0; } }

.cake-actions { display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; }
.done-msg { margin-top: 1.4rem; font: 700 2rem "Dancing Script", cursive; color: var(--pink-300); opacity: 0; transform: scale(.8); transition: .6s; }
.done-msg.show { opacity: 1; transform: none; }

/* ---------- PHOTOS ---------- */
.gallery { columns: 3 220px; column-gap: 1rem; }
.photo {
  break-inside: avoid; margin-bottom: 1rem; cursor: zoom-in; position: relative; overflow: hidden;
  border-radius: var(--radius); background: var(--card); border: 1px solid var(--card-border);
}
.photo img { display: block; width: 100%; transition: transform .5s; }
.photo:hover img { transform: scale(1.05); }
.photo figcaption {
  padding: .7rem .9rem; font-size: .9rem; text-align: left;
  border-top: 3px solid var(--pink-500);
}

.lightbox {
  position: fixed; inset: 0; z-index: 100; background: rgba(15, 5, 35, .94);
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: .8rem; padding: 1rem;
}
.lightbox.open { display: flex; }
.lightbox img { max-width: 94vw; max-height: 78vh; border-radius: 14px; }
.lightbox p { color: var(--pink-300); font-weight: 600; }
.lightbox .close { position: absolute; top: 12px; right: 20px; font-size: 2.6rem; color: #fff; background: none; border: none; cursor: pointer; }

/* ---------- FOOTER ---------- */
footer { text-align: center; padding: 3rem 1rem 4rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; opacity: .9; }

@media (max-width: 520px) {
  .module { padding: 3.5rem 1rem; }
}


/* ---------- TOP MENU ---------- */
.topnav { position: fixed; top: 0; left: 0; right: 0; z-index: 60; display: flex; gap: .4rem; justify-content: center; flex-wrap: wrap;
  padding: .7rem .6rem; background: rgba(27, 11, 58, .85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--card-border); }
.topnav a { color: var(--purple-100); text-decoration: none; font-size: .85rem; font-weight: 600; padding: .4rem .9rem; border-radius: 999px; transition: .2s; }
.topnav a:hover { background: var(--purple-500); }
.topnav a.active { background: var(--pink-500); color: #fff; }
.page .module { padding-top: 7rem; min-height: 100vh; }
.next-wrap { margin-top: 3rem; display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; }

/* ---------- MAKE A WISH ---------- */
.wish-box { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
.wish-box textarea { width: 100%; min-height: 120px; padding: 1rem; border-radius: var(--radius); border: 2px solid var(--purple-300);
  background: var(--card); color: #fff; font: 400 1rem "Poppins", sans-serif; resize: vertical; }
.wish-box textarea:focus { outline: none; border-color: var(--pink-500); }
.wish-box textarea::placeholder { color: var(--purple-300); }
.shake { animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.wish-star { position: fixed; left: 50%; bottom: 30%; z-index: 70; transform: translateX(-50%); font-size: 3rem; pointer-events: none; animation: fly 2.2s ease-in forwards; }
.wish-star span { display: block; font: 700 1.3rem "Dancing Script", cursive; color: var(--pink-300); white-space: nowrap; max-width: 80vw; overflow: hidden; text-overflow: ellipsis; }
@keyframes fly { to { transform: translate(40vw, -90vh) scale(.3); opacity: 0; } }
.wish-sent { display: none; margin-top: 1.5rem; }
.wish-sent.show { display: block; }
.wish-sent p { font: 700 2rem "Dancing Script", cursive; color: var(--pink-300); margin-bottom: 1rem; }

/* ---------- SMARTPHONE FRIENDLY ---------- */
html { -webkit-text-size-adjust: 100%; }
body { -webkit-tap-highlight-color: transparent; padding-bottom: env(safe-area-inset-bottom); }
.hero { min-height: 100vh; min-height: 100svh; }
.page .module { min-height: 100vh; min-height: 100svh; }
.btn { min-height: 44px; touch-action: manipulation; display: inline-flex; align-items: center; justify-content: center; }
.envelope-wrap { margin-top: 8rem; }                 /* room for the opened flap */
.envelope-wrap.open .paper { transform: translateY(-55px); }
.cake { margin-top: 6rem; }                          /* room for the flames under the subtitle */
.wish-box textarea { font-size: 16px; } /* 16px stops iPhone from zooming in when typing */

@media (max-width: 600px) {
  .topnav { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; gap: .3rem; padding: calc(.6rem + env(safe-area-inset-top)) .6rem .6rem;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .topnav::-webkit-scrollbar { display: none; }
  .topnav a { white-space: nowrap; flex: 0 0 auto; padding: .55rem .85rem; font-size: .8rem; }
  .page .module { padding: 5.5rem 1rem 3rem; }
  .hero h1 { font-size: clamp(4rem, 22vw, 6rem); }
  .menu { flex-direction: column; width: 100%; max-width: 280px; }
  .menu .btn { width: 100%; }
  .fav-grid { grid-template-columns: repeat(2, 1fr); gap: .7rem; }
  .fav-card { padding: 1.1rem .6rem; }
  .fav-emoji { font-size: 2rem; }
  .fav-value { font-size: .95rem; }
  .gallery { columns: 2 130px; column-gap: .7rem; }
  .photo figcaption { font-size: .8rem; padding: .5rem .6rem; }
  .next-wrap .btn, .cake-actions .btn { flex: 1 1 100%; }
  .paper-inner { font-size: .88rem; padding: 1.1rem 1rem; }
  .plate { width: 118%; }
  .done-msg { font-size: 1.6rem; }
}

  </style>
</head>
<body class="page">
  <div class="stars" aria-hidden="true"></div>
  <canvas id="confetti"></canvas>
  <nav class="topnav">
    <a href="index.html">Home</a>
    <a href="favorites.html">Favorites</a>
    <a href="letter.html">Letter</a>
    <a href="wish.html" class="active">Make a Wish</a>
    <a href="cake.html">Blow the Cake</a>
    <a href="memories.html">Memories</a>
  </nav>

  <main>
  <section class="module">
    <h2 class="script">Make a Wish ✨</h2>
    <p class="sub">Close your eyes, think of your wish, and type it below. It stays private, only you will see it.</p>
    <div class="wish-box" id="wishBox">
      <textarea id="wishText" maxlength="120" placeholder="I wish..."></textarea>
      <button class="btn" id="wishBtn">🌠 Send it to the stars</button>
    </div>
    <div class="wish-sent" id="wishSent">
      <p>Your wish is on its way 💜</p>
      <a href="cake.html" class="btn">Now blow the candles 🎂</a>
    </div>
    <div class="next-wrap">
      <a href="letter.html" class="btn ghost">⬅ Letter</a>
      <a href="cake.html" class="btn ghost">Skip to the cake</a>
    </div>
  </section>
  </main>

  <script>

const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
let pieces = [], running = false;
const COLORS = ["#b794f6", "#6d3ab3", "#ece1ff", "#ff5fb0", "#ff9fd2"]; // mostly purple, some pink
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener("resize", resize); resize();
function confetti(n = 160) {
  for (let i = 0; i < n; i++) {
    pieces.push({ x: Math.random() * canvas.width, y: -20 - Math.random() * canvas.height * 0.4,
      s: 6 + Math.random() * 8, vy: 2 + Math.random() * 4, vx: -1.5 + Math.random() * 3,
      r: Math.random() * 6, vr: -0.2 + Math.random() * 0.4, c: COLORS[Math.floor(Math.random() * COLORS.length)] });
  }
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  pieces.forEach((p) => { p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
  pieces = pieces.filter((p) => p.y < canvas.height + 20);
  if (pieces.length) requestAnimationFrame(tick); else running = false;
}


const text = document.getElementById("wishText");
document.getElementById("wishBtn").addEventListener("click", () => {
  const w = text.value.trim();
  if (!w) { text.classList.remove("shake"); void text.offsetWidth; text.classList.add("shake"); text.focus(); return; }
  const star = document.createElement("div");
  star.className = "wish-star";
  star.innerHTML = "🌠<span></span>";
  star.querySelector("span").textContent = w;
  document.body.appendChild(star);
  document.getElementById("wishBox").style.display = "none";
  setTimeout(() => { star.remove(); document.getElementById("wishSent").classList.add("show"); confetti(150); }, 2200);
});

  </script>
</body>
</html>
